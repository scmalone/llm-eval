[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-eval"
version = "0.1.0"
requires-python = ">=3.10"
description = "Checkpointed local-model evaluation runner"

[project.scripts]
llm-eval = "llm_eval.cli:main"

[tool.setuptools.packages.find]
include = ["llm_eval*"]
